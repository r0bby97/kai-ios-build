name: Build Kai IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: faden-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          task_xcode_path=$(python3 -c 'import glob,re; paths=glob.glob("/Applications/Xcode*.app"); print(max(paths,key=lambda p:tuple(map(int,re.findall(r"\d+",p))) or (0,)))')
          sudo xcode-select -s "$task_xcode_path/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Test conversation and import logic
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iPhone application
        run: |
          set -o pipefail
          xcodebuild -quiet -project Faden.xcodeproj -scheme Faden -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' -skipPackagePluginValidation -skipMacroValidation build | tee build.log
      - name: Test optimized iPhone simulator application
        run: |
          set -o pipefail
          task_simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; ds=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]; print(next((d["udid"] for d in ds if d["name"]=="iPhone 17"),ds[0]["udid"]))')
          xcodebuild test -quiet -project Faden.xcodeproj -scheme Faden -configuration Release -destination "platform=iOS Simulator,id=$task_simulator_id" -parallel-testing-enabled NO -derivedDataPath build -resultBundlePath build/OptimizedTests.xcresult ENABLE_TESTABILITY=YES KAI_TEST_FLAGS=KAI_TESTING CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation | tee optimized-tests.log
      - name: Package SideStore IPA
        run: bash scripts/package-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kai-IPA
          path: build/Kai.ipa
          retention-days: 30
      - name: Create IPA download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_version=$(python3 -c 'import plistlib; print(plistlib.load(open("build/Build/Products/Release-iphoneos/Faden.app/Info.plist","rb"))["CFBundleShortVersionString"])')
          task_build_number=$((1000 + GITHUB_RUN_NUMBER))
          cp build/Kai.ipa "build/Kai-$task_version-b$task_build_number.ipa"
          gh release create "build-$task_build_number" build/Kai.ipa "build/Kai-$task_version-b$task_build_number.ipa" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kai $task_version · Build $task_build_number" --notes-file Docs/Release.md --prerelease
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-diagnostics
          path: |
            build.log
            optimized-tests.log
          retention-days: 7
